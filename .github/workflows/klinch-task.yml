# Klinch Code сам выполняет задачу по одному промпту (живая проверка «как Claude Code»).
# Результат (папка work без node_modules, transcript.jsonl) пушится в ветку run/<id>.
name: klinch-task
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Промпт для klinch -p
        required: true
      tgz:
        description: Откуда ставить Klinch Code
        required: false
        default: https://klinch.cloud/klinch-code.tgz
      model:
        description: Модель (KLINCH_MODEL)
        required: false
        default: deepseek-v4-pro
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: npm install -g "$TGZ"
        env:
          TGZ: ${{ inputs.tgz }}
      - name: Klinch Code
        run: |
          mkdir -p work && cd work
          set +e
          klinch -p "$PROMPT" -y --output-format stream-json 2> ../stderr.log | tee ../transcript.jsonl | cut -c1-400
          echo "exit=${PIPESTATUS[0]}" | tee ../exit.txt
          true
        env:
          PROMPT: ${{ inputs.prompt }}
          KLINCH_API_KEY: ${{ secrets.KLINCH_API_KEY }}
          KLINCH_MODEL: ${{ inputs.model }}
      - name: Pack result
        if: always()
        run: |
          mkdir -p result
          cp transcript.jsonl stderr.log exit.txt result/ 2>/dev/null || true
          tar --exclude=node_modules --exclude=.cache --exclude='*.log' -czf result/work.tgz work
          find work -path '*/node_modules' -prune -o -type f \( -name '*.mp4' -o -name '*.png' -o -name '*.gif' -o -name '*.webm' \) -print | xargs -r -I{} cp {} result/
          ls -la result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: result
